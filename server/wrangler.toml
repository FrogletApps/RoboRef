name = "roboref-sync-server"
main = "src/index.cf.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 Database binding for Cloudflare Worker deployment
[[d1_databases]]
binding = "DB"
database_name = "roboref-prod"
database_id = "roboref-d1-placeholder"

# Cloudflare KV for quick token / session lookups
[[kv_namespaces]]
binding = "KV"
id = "roboref-kv-placeholder"
