<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/roboref.svg" />
    <link rel="apple-touch-icon" href="/icons/roboref-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.classList.remove(isDark ? 'light' : 'dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}

        // Listen for asset loading errors (e.g. 404 on old hashed JS bundles after deployment)
        function handleAssetError(key) {
          const reloadKey = 'roboref_asset_reload_' + (key || 'chunk');
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            var performReload = function() { window.location.reload(); };
            var clearCaches = function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).catch(function() {}).finally(performReload);
              } else {
                performReload();
              }
            };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function() {}).finally(clearCaches);
            } else {
              clearCaches();
            }
          }
        }

        function isChunkError(str) {
          if (!str) return false;
          const s = String(str).toLowerCase();
          return s.includes('failed to load module script') ||
                 s.includes('mime type') ||
                 s.includes('dynamically imported module') ||
                 s.includes('failed to fetch') ||
                 s.includes('chunkloaderror');
        }

        window.addEventListener('error', function(e) {
          const target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            const src = target.src || target.href;
            if (src && (src.includes('/assets/') || src.endsWith('.js'))) {
              handleAssetError(src.split('/').pop());
              return;
            }
          }
          const msg = e.message || (e.error && (e.error.message || e.error.stack)) || '';
          if (isChunkError(msg)) {
            handleAssetError('module_error');
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason;
          const msg = reason ? (reason.message || reason.stack || String(reason)) : '';
          if (isChunkError(msg)) {
            handleAssetError('unhandled_rejection');
          }
        });
      })();
    </script>
    <title>RoboRef</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
