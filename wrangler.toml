#:schema node_modules/wrangler/config-schema.json
name = "roboref-test"
main = "worker/index.ts"
compatibility_date = "2026-08-24"

# Default (Test) Environment Routes
routes = [
  { pattern = "test.roboref.app", custom_domain = true }
]

# Static Assets Configuration (serves Flutter Web PWA from app/build/web)
# Only /privacy routes invoke the lightweight worker; all other static assets are served directly at the edge.
# Backend API routes (/api/*) are handled by the standalone RoboApps Server Worker.
[assets]
directory = "app/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/privacy", "/privacy/"]

[vars]
ENVIRONMENT = "test"

# Observability & Logging
[observability]
enabled = true

[observability.logs]
enabled = true

# ----------------------------------------------------------------------
# Test Environment
# Deploy via: npx wrangler deploy --env test
# ----------------------------------------------------------------------
[env.test]
name = "roboref-test"
workers_dev = true
routes = [
  { pattern = "test.roboref.app", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"

# ----------------------------------------------------------------------
# Live / Production Environment
# Deploy via: npx wrangler deploy --env live
# ----------------------------------------------------------------------
[env.live]
name = "roboref"
workers_dev = false
routes = [
  { pattern = "roboref.app", custom_domain = true }
]

[env.live.vars]
ENVIRONMENT = "live"

# ----------------------------------------------------------------------
# Durable Object Migrations (Cleanup legacy DO classes from previous stack)
# ----------------------------------------------------------------------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareInstance"]

[[migrations]]
tag = "v2"
deleted_classes = ["ShareInstance"]
