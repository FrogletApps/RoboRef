#:schema server/node_modules/wrangler/config-schema.json
name = "roboref-test"
main = "server/src/index.cf.ts"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

# Default (Test) Environment Routes
routes = [
  { pattern = "test.roboref.app", custom_domain = true },
  { pattern = "test.roboref.fyi", custom_domain = true }
]

# Static Assets Configuration (serves Flutter Web PWA from app/build/web)
[assets]
directory = "app/build/web"
not_found_handling = "single-page-application"
run_worker_first = false

[vars]
ENVIRONMENT = "test"


[[d1_databases]]
binding = "DB"
database_name = "roboref-test-db"
database_id = "8bcc2138-47d7-4b1b-9f57-e668abe27b42"

# Observability & Logging
[observability]
enabled = true

[observability.logs]
enabled = true

# ----------------------------------------------------------------------
# Test Environment
# Deploy via: npx wrangler deploy --env test
# ----------------------------------------------------------------------
[env.test]
name = "roboref-test"
workers_dev = true
routes = [
  { pattern = "test.roboref.app", custom_domain = true },
  { pattern = "test.roboref.fyi", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "roboref-test-db"
database_id = "8bcc2138-47d7-4b1b-9f57-e668abe27b42"

# ----------------------------------------------------------------------
# Live / Production Environment
# Deploy via: npx wrangler deploy --env live
# ----------------------------------------------------------------------
[env.live]
name = "roboref"
workers_dev = false
routes = [
  { pattern = "roboref.app", custom_domain = true },
  { pattern = "roboref.fyi", custom_domain = true },
]

[env.live.vars]
ENVIRONMENT = "live"

[[env.live.d1_databases]]
binding = "DB"
database_name = "roboref-db"
database_id = "4cc2e2c6-eec4-4f55-bc95-481ca4d3c59e"

# ----------------------------------------------------------------------
# Durable Object Migrations (Cleanup legacy DO classes from previous stack)
# ----------------------------------------------------------------------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareInstance"]

[[migrations]]
tag = "v2"
deleted_classes = ["ShareInstance"]
