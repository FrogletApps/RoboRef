<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RoboRef is an anomaly log for Head Referees at VEX robotics competitions. It allows you to quickly record violations, see summaries before a match, and share your log with others.">

  <!-- Mobile web app capable tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RoboRef">
  <meta name="application-name" content="RoboRef">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="roboref.svg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RoboRef</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function() {
      var hostname = window.location.hostname;
      var title = "RoboRef";
      var manifestFile = "manifest.json";

      var isLocal = hostname === "localhost" ||
        hostname === "127.0.0.1" ||
        hostname === "0.0.0.0" ||
        hostname.endsWith(".local") ||
        /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)/.test(hostname);

      var isTest = !isLocal && (
        hostname.startsWith("test.") ||
        hostname.indexOf("test") !== -1 ||
        hostname.indexOf("workers.dev") !== -1
      );

      if (isLocal) {
        title = "RoboRef Local";
        manifestFile = "manifest-local.json";
      } else if (isTest) {
        title = "RoboRef Test";
        manifestFile = "manifest-test.json";
      }

      document.title = title;

      var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appleTitle) appleTitle.setAttribute("content", title);

      var appName = document.querySelector('meta[name="application-name"]');
      if (appName) appName.setAttribute("content", title);

      var manifestLink = document.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        manifestLink.setAttribute("href", manifestFile);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
